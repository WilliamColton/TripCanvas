server:
  port: 3001

spring:
  application:
    name: tripcanvas-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init.sql,classpath:db/migration/V2__image_storage.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

tripcanvas:
  root-dir: .
  data-dir: ./data
  upload-dir: ./upload
  config-file: ./config.json
  storage:
    type: ${COS_STORAGE_TYPE:local}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}
    key-prefix: images/
    signed-url-ttl-seconds: ${COS_SIGNED_URL_TTL:604800}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
  thread-pools:
    generation-tasks:
      core-size: 4
      max-size: 4
      queue-capacity: 200
      keep-alive-seconds: 60
    image-requests:
      core-size: 20
      max-size: 20
      queue-capacity: 200
      keep-alive-seconds: 60
